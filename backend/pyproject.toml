[tool.poetry]
name = "cooking-assistant-backend"
version = "0.1.0"
description = "AI-powered cooking assistant backend with RAG, voice chat, and personalized recommendations"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Database - SQLite (built-in)
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"

# Redis
redis = {extras = ["hiredis"], version = "^5.0.1"}

# Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
authlib = "^1.3.0"

# OpenAI & LangChain
openai = "^1.7.0"
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
tiktoken = "^0.5.2"

# Image processing
pillow = "^10.2.0"
pillow-avif-plugin = "^1.4.1"

# Utilities
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
aiofiles = "^23.2.1"
email-validator = "^2.1.0"
bleach = "^6.1.0"
numpy = "^1.26.2"

# Monitoring & Logging
prometheus-client = "^0.19.0"
python-json-logger = "^2.0.7"

# Rate limiting
slowapi = "^0.1.9"

# Caching
cachetools = "^5.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
black = "^23.12.1"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
